# ImageNet-1K + ResNet-50 baseline
# RTX 4060: batch=128, accum=2, ~5-6 days for 100 epochs

data:
  dataset: imagenet
  root: /root/autodl-tmp/imagenet_full/ILSVRC/Data/CLS-LOC
  input_size: 224
  batch_size: 128
  num_workers: 4
  pin_memory: true
  subset: 1.0

model:
  name: resnet50
  num_classes: 1000
  drop_path_rate: 0.0

training:
  epochs: 100
  optimizer: sgd
  base_lr: 0.1
  weight_decay: 1.0e-4
  momentum: 0.9
  scheduler: cosine
  warmup_epochs: 5
  loss: ce
  label_smoothing: 0.1
  amp: true
  accumulation_steps: 2
  grad_clip: 5.0
  ema_decay: 0.9999
  channels_last: true
  compile: false

augmentation:
  randaug: false
  color_jitter: false
  random_erasing: false

logging:
  log_interval: 100
  eval_interval: 1
  save_interval: 10
  checkpoint_dir: ./checkpoints
  log_dir: ./logs

seed: 42
